# Render Blueprint: one web service (HTTP + embedded worker) + managed Postgres.
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked on creation.
databases:
  - name: support-db
    plan: free
    databaseName: support
    user: support

services:
  - type: web
    name: support-drafts
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: support-db
          property: connectionString
      - key: RUN_WORKER
        value: "true"
      - key: DB_POOL_SIZE
        value: "15"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
